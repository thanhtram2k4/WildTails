services:
  postgres:
    image: postgres:17.10-alpine
    container_name: wildtails-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wildtails}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildtails_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-wildtails}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - wildtails-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wildtails} -d ${POSTGRES_DB:-wildtails}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.0.6-alpine
    container_name: wildtails-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - wildtails-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: wildtails-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wildtails}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wildtails_local_dev}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - wildtails-minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  wildtails-pgdata:
  wildtails-redis:
  wildtails-minio:
