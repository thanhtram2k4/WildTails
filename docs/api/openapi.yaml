openapi: 3.1.0

info:
  title: WildTails API
  version: 0.1.0
  description: >
    WildTails MVP REST API — gamified social journaling and knowledge-management platform.
    All endpoints return the unified success/error envelope.
    Private journals default to PRIVATE and are never exposed without explicit permission checks.
    AI output is always a draft; it is never published automatically.

servers:
  - url: http://localhost:3000
    description: Local development

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:
    # ------ Envelope --------------------------------------------------------
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - RATE_LIMITED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        message:
          type: string
          description: Human-readable message safe to display. Must not contain stack traces.
        details:
          description: Structured validation details. Never contains stack traces.
        requestId:
          type: string

    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          description: Payload — shape varies per endpoint (see individual responses).
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      required: [cursor, hasMore]
      properties:
        cursor:
          type: ['string', 'null']
          description: Opaque cursor for the next page. Null when no further pages exist.
        hasMore:
          type: boolean
        total:
          type: integer
          minimum: 0
          description: Total item count — only present when explicitly requested.

    # ------ Pagination query params (inline where used) ---------------------
    # Defined here for documentation reference; used as query parameters inline.
    CursorPaginationRequest:
      type: object
      properties:
        cursor:
          type: string
          description: Opaque cursor from previous page. Omit for first page.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20

    # ------ Enums -----------------------------------------------------------
    Visibility:
      type: string
      enum: [PRIVATE, PUBLIC, SELECTED_USERS, PLANET_MEMBERS]

    AiJobState:
      type: string
      enum:
        - QUEUED
        - FETCHING_SOURCE
        - PREPROCESSING
        - SUMMARIZING
        - CLASSIFYING
        - SAVING
        - COMPLETED
        - FAILED
        - CANCELLED

    PlanetRole:
      type: string
      enum: [OWNER, ADMIN, MODERATOR, MEMBER]

    PostType:
      type: string
      enum: [ORIGINAL, JOURNAL_SHARE, GOAL_UPDATE]

    ReactionType:
      type: string
      enum: [LIKE, INSIGHTFUL, SUPPORTIVE, FUNNY]

    NotificationType:
      type: string
      enum:
        - FOLLOW
        - COMMENT
        - REACTION
        - MENTION
        - GAME_INVITE
        - GOAL_REMINDER
        - AI_JOB_COMPLETE
        - MODERATION

    ReportTargetType:
      type: string
      enum: [POST, COMMENT, USER]

    ReportStatus:
      type: string
      enum: [PENDING, REVIEWED, DISMISSED, ACTIONED]

    PointSource:
      type: string
      enum:
        - POST_CREATE
        - COMMENT_CREATE
        - REACTION_GIVE
        - GAME_WIN
        - GAME_PARTICIPATE
        - AI_LOG_CREATE
        - GOAL_COMPLETE
        - DAILY_LOGIN
        - MODERATION_PENALTY

    # ------ Auth / Identity -------------------------------------------------
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Raw password — never logged.
        displayName:
          type: string
          minLength: 1
          maxLength: 50

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Raw password — never logged.

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT — never log.
        refreshToken:
          type: string
          description: Long-lived opaque token — never log.
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Refresh token — never logged.

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Raw refresh token to revoke. MUST NOT be logged.

    UserProfileResponse:
      type: object
      required: [id, email, displayName, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        bio:
          type: string
          maxLength: 500
        joinedAt:
          type: string
          format: date-time

    PublicUserProfileResponse:
      type: object
      description: >
        Public-facing user profile. Excludes email and all other private or
        internal fields. Safe to return to any authenticated caller.
      required: [id, displayName, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        bio:
          type: string
          maxLength: 500
        joinedAt:
          type: string
          format: date-time

    UpdateUserProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        bio:
          type: string
          maxLength: 500
        avatarUrl:
          type: string
          format: uri
          description: Signed URL pointing to an already-uploaded avatar in object storage.

    FollowEntry:
      type: object
      required: [userId, displayName, followedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        followedAt:
          type: string
          format: date-time

    # ------ Planet ----------------------------------------------------------
    PlanetResponse:
      type: object
      required: [id, name, slug, isDefault, memberCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: URL-safe slug, unique across all planets.
        description:
          type: string
        iconUrl:
          type: string
          format: uri
        isDefault:
          type: boolean
        memberCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    PlanetMembershipResponse:
      type: object
      required: [planetId, userId, role, joinedAt]
      properties:
        planetId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/PlanetRole'
        joinedAt:
          type: string
          format: date-time
        leftAt:
          type: ['string', 'null']
          format: date-time
          description: >
            Timestamp when the user last left the planet. Null when the membership
            is active. Cleared (set to null) on rejoin.

    PlanetMemberEntry:
      type: object
      required: [userId, displayName, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        role:
          $ref: '#/components/schemas/PlanetRole'
        joinedAt:
          type: string
          format: date-time

    # ------ Knowledge — Journal ---------------------------------------------
    CreateJournalRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          maxLength: 50000
          description: May be omitted for a title-only stub.
        planetId:
          type: string
          format: uuid
        visibility:
          $ref: '#/components/schemas/Visibility'
          default: PRIVATE
        tagIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        folderId:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid

    UpdateJournalRequest:
      type: object
      description: All fields are optional; supply only the fields to change.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          maxLength: 50000
        planetId:
          type: string
          format: uuid
        visibility:
          $ref: '#/components/schemas/Visibility'
        tagIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        folderId:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid

    JournalTag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    JournalVersion:
      type: object
      required: [id, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    JournalResponse:
      type: object
      required: [id, title, ownerId, visibility, tags, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          description: Omitted when caller does not have read permission.
        ownerId:
          type: string
          format: uuid
        planetId:
          type: string
          format: uuid
        visibility:
          $ref: '#/components/schemas/Visibility'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/JournalTag'
        folder:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        goal:
          type: object
          required: [id, title]
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
        aiSummary:
          type: string
          description: AI-generated summary draft. Not published automatically.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/JournalVersion'
          description: Previous body versions, newest first.
        sharePermissions:
          type: array
          items:
            type: object
            required: [userId, expiresAt]
            properties:
              userId:
                type: string
                format: uuid
              expiresAt:
                type: ['string', 'null']
                format: date-time
          description: Active share permissions for SELECTED_USERS journals.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ------ Knowledge — Folder ----------------------------------------------
    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: string
          format: uuid
        planetId:
          type: string
          format: uuid

    UpdateFolderRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: string
          format: uuid

    FolderResponse:
      type: object
      required: [id, name, ownerId, journalCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        journalCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    # ------ Knowledge — Tag -------------------------------------------------
    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    TagResponse:
      type: object
      required: [id, name, ownerId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid

    # ------ Knowledge — Goal ------------------------------------------------
    CreateGoalRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        deadline:
          type: string
          format: date-time
          description: ISO-8601 datetime. Omit for no deadline.
        planetId:
          type: string
          format: uuid

    UpdateGoalRequest:
      type: object
      description: All fields optional; supply only the fields to change.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 0–100. Server validates range. Do not auto-complete on AI suggestion.
        deadline:
          type: string
          format: date-time

    GoalResponse:
      type: object
      required: [id, title, ownerId, progress, deadline, linkedJournalCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        ownerId:
          type: string
          format: uuid
        progress:
          type: integer
          minimum: 0
          maximum: 100
        deadline:
          type: ['string', 'null']
          format: date-time
        planetId:
          type: string
          format: uuid
        linkedJournalCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ------ Knowledge — Share Permission ------------------------------------
    CreateSharePermissionRequest:
      type: object
      required: [journalId, userId]
      properties:
        journalId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: The user being granted read access.
        expiresAt:
          type: string
          format: date-time
          description: Omit for a non-expiring grant.

    SharePermissionResponse:
      type: object
      required: [id, journalId, userId, grantedBy, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        journalId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        grantedBy:
          type: string
          format: uuid
          description: Must be the journal owner.
        expiresAt:
          type: ['string', 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: ['string', 'null']
          format: date-time

    # ------ Social — Post ---------------------------------------------------
    CreatePostRequest:
      type: object
      required: [body, planetId, type]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        planetId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/PostType'
        journalId:
          type: string
          format: uuid
          description: Required when type is JOURNAL_SHARE.
        goalId:
          type: string
          format: uuid
          description: Required when type is GOAL_UPDATE.

    # Phase 05 amendment (D27): author embed added.
    # Phase 05 amendment (D24): journalId removed — never exposed in any API response.
    PostResponse:
      type: object
      required:
        [
          id,
          body,
          authorId,
          author,
          planetId,
          type,
          reactionCounts,
          commentCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        authorId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/PostAuthorEmbed'
        planetId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/PostType'
        goalId:
          type: string
          format: uuid
        reactionCounts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Map of ReactionType to count.
        commentCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostAuthorEmbed:
      type: object
      description: >
        Minimal public author embed (D27). Never includes email, platform role,
        avatarConfig, journals, goals, or private fields.
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: ['string', 'null']
          format: uri

    # ------ Social — Comment ------------------------------------------------
    CreateCommentRequest:
      type: object
      required: [body, postId]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        postId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          description: Present for replies. Must belong to the same postId.

    CommentResponse:
      type: object
      required: [id, body, authorId, postId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        authorId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    # ------ Social — Reaction -----------------------------------------------
    ToggleReactionRequest:
      type: object
      required: [postId, type]
      properties:
        postId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ReactionType'

    ReactionResponse:
      type: object
      required: [postId, counts]
      properties:
        postId:
          type: string
          format: uuid
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Map of ReactionType to count.
        userReaction:
          $ref: '#/components/schemas/ReactionType'
          description: The caller's current reaction. Absent if caller has no reaction.

    # ------ Social — Report -------------------------------------------------
    CreateReportRequest:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          $ref: '#/components/schemas/ReportTargetType'
        targetId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000

    ReportResponse:
      type: object
      required: [id, targetType, targetId, reason, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/ReportTargetType'
        targetId:
          type: string
          format: uuid
        reason:
          type: string
        status:
          $ref: '#/components/schemas/ReportStatus'
        createdAt:
          type: string
          format: date-time

    # Phase 05 amendment (D19): moderator report review request.
    ReviewReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [REVIEWED, DISMISSED, ACTIONED]
        note:
          type: string
          maxLength: 500

    # ------ Social — Saved Post ---------------------------------------------
    SavedPostEntry:
      type: object
      required: [postId, savedAt]
      properties:
        postId:
          type: string
          format: uuid
        savedAt:
          type: string
          format: date-time
        post:
          $ref: '#/components/schemas/PostResponse'

    # ------ AI Jobs ---------------------------------------------------------
    CreateAiJobRequest:
      description: >
        Exactly one of sourceUrl or manualTranscript must be provided.
        Supplying both or neither is a validation error (400).
        manualTranscript is treated as untrusted input and must not alter system
        instructions (prompt injection mitigation).
      oneOf:
        - type: object
          required: [sourceUrl]
          not:
            required: [manualTranscript]
          properties:
            sourceUrl:
              type: string
              format: uri
              description: Public URL to fetch and process. Mutually exclusive with manualTranscript.
            promptVersion:
              type: string
              description: Pins this job to a specific prompt version for reproducibility.
        - type: object
          required: [manualTranscript]
          not:
            required: [sourceUrl]
          properties:
            manualTranscript:
              type: string
              maxLength: 100000
              description: >
                Manual transcript entered by the user. Treated as untrusted input —
                must not alter system instructions (prompt injection mitigation).
            promptVersion:
              type: string
              description: Pins this job to a specific prompt version for reproducibility.

    AiJobStepResponse:
      type: object
      required: [state, startedAt]
      properties:
        state:
          $ref: '#/components/schemas/AiJobState'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        error:
          type: string
          description: Structured error code; absent on success.

    AiJobResponse:
      type: object
      required: [id, ownerId, state, promptVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/AiJobState'
        sourceUrl:
          type: string
          format: uri
        promptVersion:
          type: string
        summary:
          type: string
          description: AI-generated summary draft. Not automatically published.
        tags:
          type: array
          items:
            type: string
          description: AI-suggested tags. User must review before applying.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        error:
          type: string
          description: Structured error code for FAILED state.

    # ------ Gamification ----------------------------------------------------
    PointTransaction:
      type: object
      required: [id, userId, amount, source, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        amount:
          type: integer
          description: Positive for gains, negative for penalties. Integer only.
        source:
          $ref: '#/components/schemas/PointSource'
        referenceId:
          type: string
          format: uuid
          description: UUID of the entity that triggered this transaction.
        referenceType:
          type: string
          description: Discriminator for the reference (e.g. POST, GAME_SESSION).
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    PointBalanceResponse:
      type: object
      required: [userId, totalPoints]
      properties:
        userId:
          type: string
          format: uuid
        totalPoints:
          type: integer
          description: Running total from the ledger.
        rank:
          type: integer
          minimum: 1
          description: Current leaderboard rank from periodic snapshot; may be slightly stale.

    LeaderboardEntry:
      type: object
      required: [userId, displayName, totalPoints, rank]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        totalPoints:
          type: integer
        rank:
          type: integer
          minimum: 1

    InfluenceScoreBreakdown:
      type: object
      required: [content, engagement, consistency, game, penalty]
      properties:
        content:
          type: number
          description: Points from published content.
        engagement:
          type: number
          description: Points from community engagement.
        consistency:
          type: number
          description: Points from sustained platform activity.
        game:
          type: number
          description: Points from mini-game participation and wins.
        penalty:
          type: number
          description: Negative modifier from moderation actions.

    InfluenceScore:
      type: object
      required: [userId, score, rank, breakdown]
      properties:
        userId:
          type: string
          format: uuid
        score:
          type: number
          description: Composite score. Backend is the single source of truth.
        rank:
          type: integer
          minimum: 1
          description: Leaderboard position from the latest snapshot.
        breakdown:
          $ref: '#/components/schemas/InfluenceScoreBreakdown'

    # ------ Platform — Notification -----------------------------------------
    NotificationResponse:
      type: object
      required: [id, type, isRead, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        isRead:
          type: boolean
        actorId:
          type: string
          format: uuid
          description: User who triggered the notification. Absent for system notifications.
        referenceId:
          type: string
          format: uuid
          description: UUID of the related entity (post, comment, etc.).
        referenceType:
          type: string
        createdAt:
          type: string
          format: date-time

    # ------ Platform — Media ------------------------------------------------
    MediaUploadResponse:
      type: object
      required: [id, url, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Signed URL valid for the duration specified by expiresAt.
        expiresAt:
          type: string
          format: date-time

    # ------ Health ----------------------------------------------------------
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    QueryCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from previous page. Omit for first page.

    QueryLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:
    400:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    401:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    403:
      description: Authenticated but not authorised
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    409:
      description: Conflict (duplicate resource)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

# ===========================================================================
# Tags
# ===========================================================================
tags:
  - name: Identity
    description: Authentication, user profile, and follow relationships.
  - name: Planet
    description: Planet directory, membership, and planet-scoped feeds.
  - name: Knowledge
    description: Journals, folders, tags, goals, and share permissions (Captain's Cabin).
  - name: Social
    description: Posts, comments, reactions, saved posts, and content reports.
  - name: AI
    description: AI Auto-Log job lifecycle and structured output retrieval.
  - name: Gamification
    description: Point ledger, leaderboard, and Influence Score.
  - name: Platform
    description: Notifications and media upload.

