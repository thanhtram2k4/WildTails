  /planets/{id}/join:
    post:
      operationId: joinPlanet
      summary: Join a planet (or rejoin after leaving)
      description: >
        Creates a new planet membership for the caller, or reactivates an existing
        one if the user previously left (D15 rejoin behavior).
        On rejoin: leftAt is cleared, role is reset to MEMBER, and joinedAt is
        updated to the current timestamp. No duplicate membership row is created.
        Returns 409 only when the caller is already an active member.
      tags: [Planet]
      security:
        - bearerAuth: []
