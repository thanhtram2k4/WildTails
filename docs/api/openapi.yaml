                          $ref: '#/components/schemas/LeaderboardEntry'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/401'

  /influence/me:
    get:
      operationId: getMyInfluenceScore
      summary: Get the authenticated user's Influence Score and breakdown
      tags: [Gamification]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Influence Score with dimension breakdown
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InfluenceScore'
        '401':
          $ref: '#/components/responses/401'

  # =========================================================================
  # Platform — Notifications
  # =========================================================================
  /notifications:
    get:
      operationId: listNotifications
      summary: List the authenticated user's notifications (paginated)
      tags: [Platform]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QueryCursor'
        - $ref: '#/components/parameters/QueryLimit'
        - name: unreadOnly
          in: query
          schema:
            type: boolean
          description: When true, return only unread notifications.
      responses:
        '200':
          description: Paginated notification list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NotificationResponse'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/401'

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      summary: Mark a notification as read
      tags: [Platform]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'

  # =========================================================================
  # Platform — Media
  # =========================================================================
  /media/upload:
    post:
      operationId: uploadMedia
      summary: Upload a media file and receive a signed URL
      tags: [Platform]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (image or attachment).
                purpose:
                  type: string
                  enum: [avatar, journal_attachment, post_attachment]
                  description: Intended use — determines storage path and size limits.
      responses:
        '201':
          description: File uploaded; signed URL returned with expiry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MediaUploadResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'

  /media/{id}/url:
    get:
      operationId: getMediaSignedUrl
      summary: Get a fresh signed URL for a previously uploaded media object
      tags: [Platform]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Fresh signed URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MediaUploadResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'

  # =========================================================================
  # Health
  # =========================================================================
  /health:
    get:
      operationId: healthCheck
      summary: API health check
      tags: []
      security: []
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
